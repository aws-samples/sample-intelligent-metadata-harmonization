repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.5.0
          - boto3-stubs[s3]
          - types-tqdm
        args: [--ignore-missing-imports, --explicit-package-bases]
        exclude: '(^|/)tests/'

  - repo: https://github.com/awslabs/automated-security-helper
    # v3.2.2 did not prune gitignored directories from its scan set, so it scanned
    # `.dsr/` and `node_modules/` and reported hundreds of findings against scan output
    # and vendored dependencies. Its `path_matches_pattern` also has different glob
    # semantics from v3.5.x, so `.ash.yaml` could not be tuned for both at once.
    rev: v3.5.8
    hooks:
      - id: ash-simple-scan
