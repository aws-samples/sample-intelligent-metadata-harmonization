# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/automated-security-helper/refs/heads/main/automated_security_helper/schemas/AshConfig.json
#
# Automated Security Helper (ASH) configuration.
#
# Every suppression below is a reviewed false positive. Do not add an entry
# without recording why the finding is not exploitable.
project_name: metadata-harmonization

global_settings:
  severity_threshold: MEDIUM

  ignore_paths:
    - path: "**/cdk.out/**"
      reason: >-
        Build output. Gitignored, regenerated by `cdk synth`, and contains stale
        copies of source files that duplicate findings against the real sources.
    # NOTE: do not re-add a `**/node_modules/**` entry here. ignore_paths is applied
    # to findings after a scan (sarif_utils.py drops matches outright rather than
    # marking them suppressed), and every npm-audit finding is located on a
    # node_modules/<pkg>/package.json path -- so the pattern silenced all 79 of
    # npm-audit's results, the very scanner the old reason text deferred to. The
    # exclusion it was meant to provide already happens twice over: node_modules is
    # gitignored, so get_scan_set prunes it (0 of 506 scan-set files), and semgrep
    # and opengrep both skip node_modules natively even with --no-git-ignore.
    - path: "**/scratch/**"
      reason: >-
        Local scratch space, matched by .gitignore's `scratch/*` rule -- these files
        predate that rule, which is why they are still tracked. Ad-hoc debug scripts,
        imported by no source or test and never deployed. Covers 9 B108 hardcoded-/tmp
        findings in processor/scratch/verify_config_fixes.py.

  suppressions:
    # bandit: assert statements in pytest test files. B101 exists to flag asserts
    # in production code (they're stripped under `python -O`), which does not
    # apply to test files -- pytest requires assert for its own rewriting/reporting.
    - path: "projects/*/tests/*"
      rule_id: "B101"
      reason: "Asserts are the normal pytest idiom in test files, not a production risk."

    # bandit: hardcoded /tmp paths in test fixtures. These are test-only sandbox
    # directories (never deployed), used as default storage_dir values so tests
    # don't depend on the real filesystem layout.
    - path: "projects/metadata-harmonization-processor/tests/*"
      rule_id: "B108"
      reason: "Hardcoded /tmp paths are test fixture defaults, not deployed code."

    # bandit: same fake credentials already covered by the SECRET-SECRET-KEYWORD
    # suppressions below -- bandit's own hardcoded_password_string check flags
    # the identical lines independently.
    - path: "projects/api/tests/conftest.py"
      rule_id: "B105"
      reason: 'Test bootstrap sets AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY to the literal "test" so botocore never reaches real AWS.'
    - path: "projects/api/tests/integration/test_mcp_logging_integration.py"
      rule_id: "B105"
      reason: 'Fake tool parameters ("secret123", "abc123def456") used to verify MCP logging redacts sensitive fields.'
    - path: "projects/api/tests/unit/test_mcp_logging_monitoring.py"
      rule_id: "B105"
      reason: 'Fake password/token values in a logging-redaction unit test.'

    # bandit: B608 (SQL injection) false positive. This f-string builds an LLM
    # correction prompt, not a SQL query -- there is no SQL anywhere in this
    # file. Bandit's heuristic triggers on any multi-line f-string with
    # interpolation. User-supplied values are already fenced as untrusted data
    # (see `fence()` calls) before interpolation.
    - path: "projects/metadata-harmonization-processor/src/metadata_harmonization_processor/nodes/llm_resolution.py"
      rule_id: "B608"
      reason: "False positive: builds an LLM prompt string, not a SQL query."

    # detect-secrets: test fixtures. These are dummy credentials that exist so
    # tests can assert the code redacts or rejects them.
    - path: "projects/api/tests/conftest.py"
      rule_id: "SECRET-SECRET-KEYWORD"
      reason: 'Test bootstrap sets AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY to the literal "test" so botocore never reaches real AWS.'
    - path: "projects/api/tests/integration/test_mcp_logging_integration.py"
      rule_id: "SECRET-SECRET-KEYWORD"
      reason: 'Fake tool parameters ("secret123", "abc123def456") used to verify MCP logging redacts sensitive fields.'
    - path: "projects/api/tests/integration/test_mcp_logging_integration.py"
      rule_id: "SECRET-HEX-HIGH-ENTROPY-STRING"
      reason: "Same fake tool parameters as above, flagged a second time by the entropy plugin."
    - path: "projects/api/tests/unit/test_mcp_logging_monitoring.py"
      rule_id: "SECRET-SECRET-KEYWORD"
      reason: 'Fake password/token values in a logging-redaction unit test.'
    - path: "projects/infra/tests/unit/scripts/test_environment_generation.test.ts"
      rule_id: "SECRET-BASE64-HIGH-ENTROPY-STRING"
      reason: "Expected-value assertions on generated .env content; the strings are test bucket and table names."

    # detect-secrets: documentation and example placeholders.
    - path: "projects/metadata-harmonization-processor/docs/INSTALLATION.md"
      rule_id: "SECRET-SECRET-KEYWORD"
      reason: 'Setup instructions showing export AWS_SECRET_ACCESS_KEY="your-secret-access-key" as a placeholder.'
    - path: "projects/metadata-harmonization-processor/docs/TROUBLESHOOTING.md"
      rule_id: "SECRET-SECRET-KEYWORD"
      reason: 'Troubleshooting steps showing export AWS_SECRET_ACCESS_KEY="your-secret" as a placeholder.'
    - path: "projects/metadata-harmonization-processor/examples/custom_implementations.py"
      rule_id: "SECRET-SECRET-KEYWORD"
      reason: 'Example code passing api_key="your-api-key-here" to an illustrative APISchemaCollector.'
