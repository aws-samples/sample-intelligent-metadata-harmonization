[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metadata-harmonization-agent"
version = "0.1.0"
description = "AWS Strands agent for metadata validation and schema discovery"
authors = [
    {name = "Metadata Harmonization Team", email = "team@example.com"}
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # MCP client library
    "mcp>=1.0.0",

    # AWS Strands Agent framework
    "strands-agents>=1.19.0",

    # CLI interface
    "click>=8.0.0",

    # Enhanced console output
    "rich>=13.0.0",

    # Beautiful logging
    "loguru>=0.7.0",

    # HTTP client for API calls
    "aiohttp>=3.9.0",

    # YAML configuration support
    "PyYAML>=6.0.0",

    # CSV handling (for test data only)
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.9",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
metadata-agent = "metadata_agent.main:cli"

[project.urls]
Homepage = "https://github.com/example/metadata-harmonization-agent"
Repository = "https://github.com/example/metadata-harmonization-agent"
Documentation = "https://github.com/example/metadata-harmonization-agent/docs"
"Bug Tracker" = "https://github.com/example/metadata-harmonization-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metadata_agent = ["py.typed"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["metadata_agent"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "strands.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=metadata_agent",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
asyncio_mode = "auto"
