# Basic Configuration Example
# Minimal configuration for local development and testing
# This configuration works without AWS credentials for most features

# AWS Configuration (not required for local development mode)
aws_region: "us-east-1"
aws_profile: "default"

# Session Management - File-based for local development
session_saver_type: "file"
file_session_directory: "./sessions"

# Local Development Mode Settings
# When enabled, uses local implementations instead of cloud services
local_development_mode: true

# Data Saver Configuration
# Job Status Saver - For local development: use "local" with file-based storage
job_status_saver_type: "local"  # Options: "local" or "dynamodb"
job_status_storage_dir: "./data/job_status"  # Local directory for job status files
# job_status_table_name: "metadata-harmonization-jobs"  # DynamoDB table (for production)

# Result Saver - For local development: use "local" with file-based storage
result_saver_type: "local"  # Options: "local" or "s3"
results_local_dir: "./data/validation-results"  # Local directory for result files
# results_s3_bucket: "my-results-bucket"  # S3 bucket (for production)
# results_s3_prefix: "validation-results/"

# Caching Configuration
# Disable Redis caching for simple local setup
enable_redis_cache: false
# Enable in-memory caching as fallback when Redis is disabled
enable_memory_cache: true
memory_cache_max_size: 1000

# AI Model Configuration
# For local development, you can disable AI features or use Bedrock
embedding_provider: "bedrock"
bedrock_model_id: "amazon.titan-embed-text-v2:0"
cosine_similarity_threshold: 0.7
max_retries: 3

# Processing Configuration
timeout_seconds: 300

# Schema Configuration
# Update this path to point to your local schema directory
schema_directory: "./data/schema"
