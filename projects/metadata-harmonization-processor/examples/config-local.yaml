# Local Development Configuration
# Optimized for local development with LocalResultSaver and LocalJobStatusSaver
# Works completely offline without AWS credentials

# AWS Configuration (optional for local development)
aws_region: "us-east-1"
aws_profile: "default"

# Session Management - File-based for local development
session_saver_type: "file"

# Local Development Mode Settings
local_development_mode: true
disable_ai_features: false  # Set to true to disable AI predictions

# Job Status Configuration - Local file-based storage
job_status_saver_type: "local"
job_status_storage_dir: "./data/job_status"

# Result Storage Configuration - Local file-based storage with LocalResultSaver
result_saver_type: "local"
results_local_dir: "./data/validation-results"

# Caching Configuration - No Redis, use in-memory caching
enable_redis_cache: false
enable_memory_cache: true
memory_cache_max_size: 1000

# AI Model Configuration - Bedrock for embeddings (requires AWS credentials)
embedding_provider: "bedrock"
bedrock_model_id: "amazon.titan-embed-text-v2:0"
cosine_similarity_threshold: 0.7
max_retries: 3

# Processing Configuration
timeout_seconds: 300

# Schema Configuration - Local schema directory
schema_directory: "./data/schema"

# Performance Settings for Local Development
batch_size: 100
parallel_processing: false
